# BASS 프로젝트 설정. BASS 코드를 복사하지 않고 버전을 의존한다.
bass:
  version: 0.2.1
  profiles:
    - common
    - web

project:
  name: fixture-web
  description: BASS 전체 흐름 검증용 예시 프로젝트

# capability alias 만 사용한다. 모델명을 직접 쓰지 마라.
models:
  worker: auto

workflow:
  max_active_tasks: 1
  reviewer_required: true

evaluators:
  level1:
    - name: fixture-static-check
      command: node -e "process.exit(0)"
  level2:
    - name: fixture-behavior-check
      command: node -e "process.exit(0)"
  level3: []
