name: BASS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: ./scripts/check-prerequisites.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm test
      - run: npm run build
      - run: npm run smoke:nan
      - run: npm run smoke:package
