# BASS 자동 정지 및 인간 승인 조건 (Core 프롬프트 §17)
#
# 이 파일은 버전이 고정되는 "동작" 이다. 운영 데이터(모델 매핑)와 달리
# 변경 시 BASS 버전을 올린다.
#
# trigger 매칭 소스:
# - risk_reasons: 작업 파일 risk.reasons 항목
# - task_types: 작업 파일 type
# - risk_levels: 작업 파일 risk.level

version: 1

rules:
  - id: auth-and-permissions
    description: 인증, 권한, 결제, 개인정보를 건드리는 변경
    triggers:
      risk_reasons: [touches-auth, touches-permissions, touches-billing, touches-pii, touches-user-session]

  - id: data-destruction
    description: 데이터 삭제 및 운영 DB 마이그레이션
    triggers:
      risk_reasons: [deletes-data, production-db-migration]

  - id: public-api-breaking
    description: 공개 API 비호환 변경, 영구적 데이터 포맷 변경
    triggers:
      risk_reasons: [breaks-public-api, changes-persistent-format]

  - id: new-dependency-or-service
    description: 새로운 외부 서비스 또는 주요 의존성 도입
    triggers:
      risk_reasons: [new-external-service, new-major-dependency]

  - id: infra-cost
    description: 비용이 발생하는 인프라 변경
    triggers:
      risk_reasons: [infra-cost]

  - id: large-architecture-change
    description: 대규모 아키텍처 변경, 광범위한 파일 이동
    triggers:
      risk_reasons: [large-architecture-change, mass-file-move]

  - id: irreversible
    description: 되돌리기 어려운 변경
    triggers:
      risk_reasons: [hard-to-rollback]
      risk_levels: [critical]

  - id: secrets-access
    description: 비밀정보 접근
    triggers:
      risk_reasons: [touches-secrets]

  - id: deploy-release
    description: 배포 또는 릴리스
    triggers:
      task_types: [deploy, release]
      risk_reasons: [deploys]

  - id: harness-replacement
    description: 기존 하네스 삭제 또는 완전 교체
    triggers:
      risk_reasons: [replaces-harness]

  - id: design-direction
    description: 핵심 디자인 방향, 브랜드 Voice, 주요 탐색 구조 변경
    triggers:
      risk_reasons: [changes-design-direction, changes-brand-voice, changes-navigation-structure]

  - id: unverifiable-by-tests
    description: 테스트로 완료 판정이 불가능한 작업
    triggers:
      risk_reasons: [not-testable]

  - id: expert-domain
    description: 전문 영역 (전문가 검토 없이 완료 처리 금지)
    triggers:
      risk_reasons: [expert-domain]
