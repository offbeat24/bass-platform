bass:
  version: 0.4.0
  profiles: [common, cli]

project:
  name: bass-platform
  description: Portable BASS CLI and team plugin runtime

execution:
  depth: adaptive
  verification: affected
  loop:
    no_progress_limit: 1
  parallel:
    max_agents: 2

context:
  max_chars: 12000

capabilities:
  specification: builtin
  simplicity: ponytail
  ui_direction: off
  ui_canvas: off
  html_report: bass

adapters:
  primary: codex
  compatibility: [claude, cursor]
  runner: host
  context_provider: bass
  workspace_executor: host
  collaboration_provider: events

workflow:
  max_active_tasks: 1
  reviewer_required: true

evaluators:
  level1:
    - name: typecheck
      command: npm run typecheck
  level2:
    - name: tests
      command: npm test
    - name: build
      command: npm run build
  level3:
    - name: package-smoke
      command: npm run smoke:package
      surfaces: [release]
    - name: plugin-manifest
      command: npm run validate:plugin
      surfaces: [release]
    - name: performance-budget
      command: npm run benchmark:performance
      surfaces: [release]
