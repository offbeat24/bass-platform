bass:
  version: 0.3.0
  profiles: [common, cli]

project:
  name: bass-platform
  description: Portable BASS CLI and team plugin runtime

execution:
  depth: adaptive
  verification: affected

capabilities:
  specification: builtin
  simplicity: ponytail
  ui_direction: off
  ui_canvas: off
  html_report: bass

adapters:
  primary: codex
  compatibility: [claude, cursor]

workflow:
  max_active_tasks: 1
  reviewer_required: true

evaluators:
  level1:
    - name: typecheck
      command: npm run typecheck
  level2:
    - name: tests
      command: npm test
    - name: build
      command: npm run build
  level3:
    - name: package-smoke
      command: npm run smoke:package
      surfaces: [release]
    - name: plugin-manifest
      command: npm run validate:plugin
      surfaces: [release]
